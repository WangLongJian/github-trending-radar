name: Scheduled Cloud Publisher (X/Twitter)

on:
  schedule:
    # 每 30 分钟轮巡检查一次是否有到期的随机排期推文需要发布
    - cron: '*/30 * * * *'

  # 支持在 GitHub 网页上手动点击一键测试发布
  workflow_dispatch:
    inputs:
      account:
        description: '发布账号 (all / alpha / wangkun)'
        required: true
        default: 'all'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          playwright install --with-deps chromium

      - name: Run Cloud Publisher
        env:
          COOKIES_ALPHA: ${{ secrets.COOKIES_ALPHA }}
          COOKIES_WANGKUN: ${{ secrets.COOKIES_WANGKUN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.account }}" != "all" ]; then
            python cloud_publisher.py ${{ inputs.account }}
          else
            python cloud_publisher.py
          fi

      - name: Commit and push queue updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --exit-code schedule_queue.json; then
            git add schedule_queue.json
            git commit -m "Update post schedule queue status [skip ci]"
            git push
          else
            echo "No queue status change."
          fi

name: Daily Trending Radar Collector

on:
  schedule:
    # 每天 UTC 01:00 (北京时间上午 09:00) 自动定时运行
    - cron: '0 1 * * *'

  # 支持在 GitHub 页面上随时手动触发运行 (Actions -> Run workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trending Collector & Auto-Scheduler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python collector.py
          python scheduler.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --exit-code candidates.md state.json candidates/ schedule_queue.json; then
            git add candidates.md state.json candidates/ schedule_queue.json
            git commit -m "Auto-collect trending candidates & update queue [skip ci]"
            git push
          else
            echo "No new trending candidates found today."
          fi
